# georgewyrd fork only: merge upstream orbat-mapper/orbat-mapper main into a PR against our main.
# Cloudflare Pages deploys orbat.georgewyrd.com from main, so nothing goes live until the PR is merged.
name: Upstream sync PR

on:
  schedule:
    - cron: "0 10 * * 1" # Mondays 10:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/orbat-mapper/orbat-mapper.git
  BRANCH: upstream-sync
  GH_TOKEN: ${{ github.token }}
  # In a fork, gh defaults to the parent repo; pin it to ours.
  GH_REPO: ${{ github.repository }}

jobs:
  sync:
    if: github.repository == 'tgmckinney/orbat-mapper'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        id: fetch
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --quiet upstream main
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(git rev-parse --short upstream/main)" >> "$GITHUB_OUTPUT"
          echo "Upstream commits not in main: $behind"

      - name: Merge upstream into a fresh branch
        id: merge
        if: steps.fetch.outputs.behind != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          if git merge --no-edit upstream/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > conflicts.txt
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report merge conflict
        if: steps.merge.outputs.conflict == 'true'
        run: |
          title="Upstream sync conflict"
          body=$(printf 'Merging upstream main (%s) into main conflicts in:\n\n```\n%s\n```\n\nResolve locally: `git fetch origin && git merge origin/main` on a branch from `fork/main`, then open a PR.\n\nRun: %s' \
            "${{ steps.fetch.outputs.upstream_sha }}" "$(cat conflicts.txt)" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          exit 1

      - name: Setup pnpm
        if: steps.merge.outputs.conflict == 'false'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.merge.outputs.conflict == 'false'
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      # PRs opened with GITHUB_TOKEN trigger no workflows, so the checks run here and their result goes in the PR body.
      - name: Checks (type-check, build, tests)
        id: checks
        if: steps.merge.outputs.conflict == 'false'
        continue-on-error: true
        run: |
          pnpm install --frozen-lockfile
          pnpm run type-check
          pnpm run build-only
          pnpm run test:unit

      - name: Push branch and open or update PR
        if: steps.merge.outputs.conflict == 'false'
        run: |
          git push --force origin "$BRANCH"
          if [ "${{ steps.checks.outcome }}" = "success" ]; then
            checks="✅ type-check, build and unit tests passed on the merged tree."
          else
            checks="❌ Checks failed on the merged tree. See the run log before merging."
          fi
          {
            echo "Merges ${{ steps.fetch.outputs.behind }} upstream commits (orbat-mapper/orbat-mapper@${{ steps.fetch.outputs.upstream_sha }}) into our main."
            echo
            echo "$checks"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Merging deploys orbat.georgewyrd.com. Check the Cloudflare Pages preview for \`$BRANCH\` first."
            echo
            echo "### Upstream changes"
            echo '```'
            git log --no-merges --format='%h %s' main..upstream/main | head -80
            echo '```'
          } > body.md
          title="Sync upstream orbat-mapper (${{ steps.fetch.outputs.upstream_sha }})"
          pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file body.md
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file body.md
          fi

      - name: Fail the run if checks failed
        if: steps.checks.outcome == 'failure'
        run: exit 1
